<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ボルコの電験ルーム</title>
<meta name="theme-color" content="#2A2140">
<meta name="description" content="TAC 電験三種Webコースの予定・進捗・学習時間を、ドット絵のボルコと管理する学習アプリ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>html,body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<script>window.cloudReady = new Promise(r => { window.__cloudResolve = r; });</script>
<script src="firebase-config.js"></script>
<script src="toc.js"></script>
<script type="module" src="cloud.js"></script>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* Layout: 左（スマホでは上）にドット絵の部屋とキャラ、右（下）に単元・タイマー・記録。ゲーム画面風の単一テーマ。 */
:root{
  --bg1:#B9A8FF; --bg2:#FFC6E2; --bg3:#FFE7B3;
  --panel:#FFFDF8; --panel2:#F2EDFF; --ink:#2A2140; --ink2:#4B3F72; --muted:#6F6590; --line:#DDD3F2;
  --accent:#FF4F8B; --yellow:#FFD23F; --mint:#3FD6A0; --white:#FFFFFF;
  --c-riron:#3D7BF0; --c-kikai:#14A06B; --c-denryoku:#EE8A00; --c-hoki:#9A5CF5;
  --ok:#14A06B; --warn:#D97F00; --bad:#E2384F; --ok-soft:#D3F6E6; --warn-soft:#FFEDC7; --bad-soft:#FFDCE2;
  --h0:#E9E3F8; --h1:#FFD0E1; --h2:#FF9DC0; --h3:#FF6E9E; --h4:#FF4F8B;
  --f:"DotGothic16","MS Gothic","Osaka-Mono",monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--bg1)}
body{
  background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 55%,var(--bg3) 100%) fixed;
  color:var(--ink); font-family:var(--f); font-size:15px; line-height:1.55; min-height:100vh;
  -webkit-font-smoothing:none;
}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px dashed var(--accent);outline-offset:3px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.82rem}
h2,h3{margin:0;font-weight:400;text-wrap:balance;line-height:1.3}
h2{font-size:1.15rem}

/* ピクセル枠：角が欠けた3pxの縁取り */
.px{background:var(--panel);box-shadow:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink),0 9px 0 -3px rgba(42,33,64,.28);margin:3px}
.px.alt{background:var(--panel2)}

.app{max-width:1120px;margin:0 auto;padding-block:14px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.side{display:grid;gap:14px;min-width:0}
.main{display:grid;gap:16px;min-width:0;align-content:start}

/* タイトルバー */
.titlebar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 10px;background:var(--ink);color:var(--white);box-shadow:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink);margin:3px}
.titlebar .t{display:flex;align-items:center;gap:8px;font-size:.95rem;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titlebar .t svg{width:16px;height:16px;color:var(--yellow);flex:none}
.tac{background:var(--yellow);color:var(--ink);text-decoration:none;padding:3px 10px;font-size:.85rem;white-space:nowrap;box-shadow:inset 0 -3px 0 0 rgba(0,0,0,.18)}
.tac[aria-disabled="true"]{opacity:.45;pointer-events:none}

/* HUD */
.hud{display:flex;align-items:center;gap:10px}
.lv{flex:none;width:52px;height:52px;border-radius:50%;background:var(--ink);color:var(--white);display:grid;place-items:center;line-height:1;box-shadow:0 0 0 3px var(--white),0 0 0 6px var(--ink);text-align:center}
.lv span{font-size:.62rem;color:var(--yellow);display:block}
.lv b{font-weight:400;font-size:1.25rem}
.xp{flex:1;min-width:0}
.xpbar{height:16px;background:var(--white);box-shadow:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink);margin:3px;position:relative;overflow:hidden}
.xpbar b{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--mint) 0 6px,#2FC28E 6px 8px);transition:width .6s steps(12)}
.xp small{display:flex;justify-content:space-between;font-size:.72rem;color:var(--ink2);padding:0 4px}
.pts{flex:none;display:flex;align-items:center;gap:6px;background:var(--ink);color:var(--white);padding:4px 12px 4px 8px;box-shadow:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink);margin:3px}
.pts svg{width:16px;height:16px;color:var(--yellow)}

/* 部屋 */
.scene{position:relative;padding:0;overflow:visible;background:#2A2140}
.scene canvas{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;cursor:pointer;aspect-ratio:192/128}
.bubble{position:absolute;left:4%;right:30%;top:5%;background:var(--white);color:var(--ink);padding:8px 11px;font-size:.92rem;line-height:1.45;min-height:2.6em;box-shadow:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink);pointer-events:none;transition:opacity .2s}
.bubble::after{content:"";position:absolute;left:22%;bottom:-12px;width:12px;height:9px;background:var(--white);box-shadow:3px 0 0 0 var(--ink),-3px 0 0 0 var(--ink),0 3px 0 0 var(--ink);clip-path:polygon(-3px 0,calc(100% + 3px) 0,calc(100% + 3px) 100%,-3px 100%)}
.bubble.hide{opacity:0}
.bubble .who{display:block;font-size:.7rem;color:var(--accent)}
.status{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{padding:7px 10px;text-align:center;min-width:0}
.stat .l{font-size:.7rem;color:var(--muted);display:block}
.stat .v{font-size:1.25rem;line-height:1.2}
.stat .v small{font-size:.72rem;color:var(--muted)}
.stat.alert .v{color:var(--bad)}
.timerchip{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:var(--white);padding:6px 10px;box-shadow:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink);margin:3px;cursor:pointer;border:0;width:calc(100% - 6px)}

/* ナビ */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:15;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;padding:10px max(14px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));background:rgba(42,33,64,.18);backdrop-filter:blur(6px)}
.nbtn{border:0;background:var(--panel);color:var(--ink);display:grid;justify-items:center;gap:3px;padding:7px 2px 6px;cursor:pointer;font-size:.74rem;box-shadow:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink),inset 0 -4px 0 0 var(--line);margin:3px}
.nbtn svg{width:24px;height:24px}
.nbtn[aria-current="page"]{background:var(--ink);color:var(--white);box-shadow:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink),inset 0 -4px 0 0 #000}
.nbtn[aria-current="page"] svg{color:var(--yellow)}
.nbtn:active{transform:translateY(2px)}

/* 汎用 */
.panel{padding:14px 16px}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.head h2::before{content:"▶ ";color:var(--accent)}
.btn{border:0;background:var(--ink);color:var(--white);padding:7px 14px;cursor:pointer;font-size:.88rem;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:6px;box-shadow:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink),inset 0 -3px 0 0 #000;margin:3px}
.btn:hover{background:var(--ink2)}
.btn:active{transform:translateY(2px)}
.btn.pink{background:var(--accent)} .btn.pink:hover{background:#ff3a7d}
.btn.light{background:var(--panel);color:var(--ink);box-shadow:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink),inset 0 -3px 0 0 var(--line)}
.btn.armed{background:var(--bad)}
.btn.tiny{padding:3px 9px;font-size:.78rem}
.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;background:var(--panel);color:var(--ink);padding:4px 11px;font-size:.84rem;cursor:pointer;box-shadow:0 -2px 0 0 var(--ink),0 2px 0 0 var(--ink),-2px 0 0 0 var(--ink),2px 0 0 0 var(--ink);margin:2px}
.chip[aria-pressed="true"]{background:var(--sc,var(--accent));color:var(--white)}
label.f{display:grid;gap:3px;font-size:.76rem;color:var(--muted);min-width:0}
input[type=text],input[type=number],input[type=date],input[type=url],input[type=time]{width:100%;min-width:0;background:var(--white);border:0;padding:6px 8px;font-size:.9rem;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink2);border-radius:0}
input:focus{outline:none;box-shadow:inset 0 0 0 3px var(--accent)}
.pill{display:inline-block;font-size:.72rem;padding:0 7px;white-space:nowrap;box-shadow:0 0 0 2px currentColor;margin:0 2px}
.pill.ok{color:var(--ok);background:var(--ok-soft)} .pill.warn{color:var(--warn);background:var(--warn-soft)} .pill.bad{color:var(--bad);background:var(--bad-soft)} .pill.n{color:var(--muted);background:var(--h0)}
.empty{padding:12px;background:var(--panel2);font-size:.88rem;box-shadow:inset 0 0 0 2px var(--line)}
.note{font-size:.82rem;background:#FFF4C2;padding:8px 11px;margin-top:12px;box-shadow:inset 0 0 0 2px var(--yellow)}

/* 進捗 */
.sp{display:grid;grid-template-columns:3.4em minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:7px 0;border-top:2px dotted var(--line)}
.sp:first-of-type{border-top:0}
.sp .nm{color:var(--sc)}
.track{position:relative;height:14px;background:var(--white);box-shadow:0 -2px 0 0 var(--ink),0 2px 0 0 var(--ink),-2px 0 0 0 var(--ink),2px 0 0 0 var(--ink);margin:2px}
.track b{position:absolute;left:0;top:0;bottom:0;background:repeating-linear-gradient(90deg,var(--sc) 0 7px,transparent 7px 8px)}
.track .exp{position:absolute;top:-6px;bottom:-6px;width:3px;background:var(--accent)}
.sp .st{font-size:.8rem;white-space:nowrap;text-align:right}
.sp .meta{grid-column:2/4;font-size:.74rem;color:var(--muted)}

.next{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.next li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:8px 10px 8px 14px;background:var(--white);box-shadow:0 -2px 0 0 var(--ink),0 2px 0 0 var(--ink),-2px 0 0 0 var(--ink),2px 0 0 0 var(--ink),inset 6px 0 0 0 var(--sc);margin:2px}
.next .ch{font-size:.74rem;color:var(--sc);grid-column:1/-1}
.next .tt{min-width:0}
.next .tt span{display:block;font-size:.78rem;color:var(--muted)}

/* 単元 */
.subjbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.flow{display:flex;flex-wrap:wrap;gap:6px;font-size:.74rem;color:var(--ink2);margin:10px 0 0;padding:0;list-style:none}
.flow li{background:var(--panel2);padding:2px 8px}
.chap{padding:12px 14px;display:grid;gap:10px;background:var(--white)}
.chap.done{background:#EFFBF5}
.chap.test{background:#FFF8DC}
.chap .name{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.chap .code{background:var(--sc);color:var(--white);padding:0 6px;font-size:.78rem}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.step{border:0;background:var(--panel2);color:var(--ink);font-size:.76rem;cursor:pointer;padding:6px 4px;display:grid;justify-items:center;gap:4px;box-shadow:0 -2px 0 0 var(--ink),0 2px 0 0 var(--ink),-2px 0 0 0 var(--ink),2px 0 0 0 var(--ink);margin:2px;line-height:1.2}
.step::before{content:"";width:14px;height:14px;background:var(--white);box-shadow:inset 0 0 0 2px var(--ink)}
.step[aria-pressed="true"]{background:var(--sc);color:var(--white)}
.step[aria-pressed="true"]::before{background:var(--yellow);box-shadow:inset 0 0 0 2px var(--ink),inset 0 0 0 4px var(--white)}
.dates{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.row2{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.row2 .memo{flex:1 1 200px;min-width:0}
.ustate .chip.weak[aria-pressed="true"]{background:var(--bad)} .ustate .chip.mid[aria-pressed="true"]{background:var(--warn)} .ustate .chip.good[aria-pressed="true"]{background:var(--ok)}
.chaplist{display:grid;gap:12px}
.step small{display:block;font-size:.66rem;opacity:.85}
.secs{background:var(--panel2);padding:6px 10px;box-shadow:inset 0 0 0 2px var(--line)}
.secs summary{cursor:pointer;font-size:.84rem;padding:4px 0;list-style:none}
.secs summary::before{content:"▶ ";color:var(--accent)}
.secs[open] summary::before{content:"▼ "}
.seclist{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:6px}
.sec{display:grid;grid-template-columns:minmax(0,1fr) 9.5em auto;gap:8px;align-items:center;padding:6px 8px;background:var(--white);font-size:.84rem}
.sec.ok{background:#EFFBF5}
.sec .sn b{font-weight:400;color:var(--sc)}
.sec input[type=date]{padding:3px 5px;font-size:.78rem}
.sb{display:flex;gap:4px}
.step.mini{padding:3px 7px;grid-auto-flow:column;align-items:center;gap:4px;font-size:.72rem}
.step.mini::before{width:10px;height:10px}
.tocedit{display:grid;gap:8px;margin-top:6px}
.tocedit textarea{width:100%;font:inherit;font-size:.85rem;padding:8px;border:0;box-shadow:inset 0 0 0 2px var(--ink2);background:var(--white);color:var(--ink);resize:vertical}
.plprev{margin:12px 0 0;padding:8px 10px;font-size:.84rem;background:var(--panel2);box-shadow:inset 0 0 0 2px var(--line);line-height:1.8}
.plconfirm{margin-top:12px;padding:10px 12px;background:#FFF4C2;box-shadow:inset 0 0 0 2px var(--yellow);font-size:.88rem}
.plmsg{margin:10px 0 0;padding:7px 10px;font-size:.84rem}
.plmsg.ok{background:var(--ok-soft);color:var(--ok);box-shadow:inset 0 0 0 2px var(--ok)}
.plmsg.bad{background:var(--bad-soft);color:var(--bad);box-shadow:inset 0 0 0 2px var(--bad)}
.quota{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.84rem;margin-bottom:10px;padding:6px 10px;background:#FFF4C2;box-shadow:inset 0 0 0 2px var(--yellow)}
.quota b{font-weight:400;font-size:1.1rem;color:var(--accent)}
@media (max-width:520px){.sec{grid-template-columns:minmax(0,1fr) auto}.sec .sn{grid-column:1/-1}}

/* タイマー */
.tface{font-size:clamp(3rem,14vw,5.2rem);text-align:center;line-height:1;letter-spacing:.04em;padding:18px 0 8px;font-variant-numeric:tabular-nums}
.tbar{height:12px;background:var(--white);box-shadow:0 -2px 0 0 var(--ink),0 2px 0 0 var(--ink),-2px 0 0 0 var(--ink),2px 0 0 0 var(--ink);margin:4px 2px 16px}
.tbar b{display:block;height:100%;background:var(--accent);transition:width .5s linear}
.tctl{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:14px}
.tsec{display:grid;gap:8px;margin-top:12px}
.tsec .lbl{font-size:.76rem;color:var(--muted)}

/* 記録 */
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,13px);grid-auto-columns:13px;gap:3px;overflow-x:auto;padding:3px}
.heat i{background:var(--h0)}
.heat i[data-l="1"]{background:var(--h1)} .heat i[data-l="2"]{background:var(--h2)} .heat i[data-l="3"]{background:var(--h3)} .heat i[data-l="4"]{background:var(--h4)}
.heat i.today{box-shadow:0 0 0 2px var(--ink)}
.legend{display:flex;gap:4px;align-items:center;font-size:.72rem;color:var(--muted);margin-top:6px}
.legend i{width:11px;height:11px;display:inline-block}
.loglist{list-style:none;margin:0;padding:0}
.loglist li{display:grid;grid-template-columns:6.2em 3.4em minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 0;border-top:2px dotted var(--line);font-size:.86rem}
.loglist li:first-child{border-top:0}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:3.6em minmax(0,1fr) 4em;gap:10px;align-items:center;font-size:.84rem}
.qlog{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.qlog .full{grid-column:1/-1}
.mini{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

/* 設定 */
.qrwrap{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;align-items:center}
.qr{width:150px;aspect-ratio:1;max-width:100%;background:var(--white);box-shadow:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink);margin:3px}
.qr svg{display:block;width:100%;height:100%}
.qrsteps{margin:0;padding-left:1.3em;font-size:.86rem;display:grid;gap:4px}
.qrsteps b{font-weight:400;color:var(--accent)}
.qrurl{display:flex;gap:8px;align-items:center;margin-top:12px}
.qrurl input{flex:1;font-size:.78rem}
@media (max-width:420px){.qrwrap{grid-template-columns:minmax(0,1fr);justify-items:center}}
.sgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ssub{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:12px 0;border-top:2px dotted var(--line)}
.ssub .nm{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;color:var(--sc)}
.ssub .url{grid-column:1/-1}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(16px);background:var(--ink);color:var(--white);padding:8px 14px;font-size:.88rem;opacity:0;transition:.2s;pointer-events:none;z-index:30;box-shadow:0 0 0 3px var(--white),0 0 0 6px var(--ink);max-width:calc(100% - 40px)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media (min-width:920px){
  .app{grid-template-columns:440px minmax(0,1fr);padding-bottom:40px;align-items:start}
  .side{position:sticky;top:14px}
  .nav{position:static;background:none;backdrop-filter:none;padding:0}
  .toast{bottom:30px}
}
@media (max-width:420px){
  .steps{grid-template-columns:repeat(2,minmax(0,1fr))}
  .loglist li{grid-template-columns:5.6em 3em minmax(0,1fr) auto;gap:6px}
  .bubble{font-size:.84rem;right:24%}
  .sgrid{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <aside class="side">
    <div class="titlebar">
      <span class="t"><svg id="ic-bolt-t" viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true"></svg>ボルコの電験ルーム</span>
      <a class="tac" id="tacTop" href="#" target="_blank" rel="noopener" aria-disabled="true">TAC ↗</a>
    </div>
    <div class="hud">
      <div class="lv" aria-label="レベル"><div><span>Lv</span><b id="lv">1</b></div></div>
      <div class="xp"><div class="xpbar"><b id="xpfill" style="width:0%"></b></div><small><span id="xpnext">次のレベルまで —</span><span id="save">読み込み中…</span></small></div>
      <div class="pts" title="これまでに獲得したボルト（XP）"><svg id="ic-bolt" viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true"></svg><b id="xp" class="num" style="font-weight:400">0</b></div>
    </div>
    <div class="scene px">
      <canvas id="room" width="192" height="128" aria-label="ボルコの部屋。タップすると勉強のヒントを話します"></canvas>
      <div class="bubble" id="bubble" aria-live="polite"><span class="who">ボルコ</span><span id="say"></span></div>
    </div>
    <div id="timerchip"></div>
    <div class="status" id="status"></div>
    <nav class="nav" id="nav" aria-label="メニュー"></nav>
  </aside>

/* 単元の「教科書」「問題集」は節のチェックから決まる。全部そろうと修了日が入る */

/* ================= 状態 ================= */
function defaultState(){
  const t = today();
  const st = {v:1, settings:{examDate:"", deadline:"", weeklyGoal:7, tacTop:TAC_TOP_DEFAULT, subjects:{}}, progress:{}, logs:[]};
  SUBJECTS.forEach(s => { st.settings.subjects[s.key] = {start:t, end:addMonths(t,6), url:""}; });

}
function normalize(st){
  st = st && typeof st === "object" ? JSON.parse(JSON.stringify(st)) : {};
  const S = st.settings = st.settings || {};
  S.examDate ??= ""; S.deadline ??= ""; S.weeklyGoal ??= 7; S.tacTop ??= TAC_TOP_DEFAULT; S.subjects ??= {};
  st.progress ??= {}; st.logs = Array.isArray(st.logs) ? st.logs : [];
  st.toc = st.toc && typeof st.toc === "object" ? st.toc : {};
  SUBJECTS.forEach(s => {
    S.subjects[s.key] ??= {start:today(), end:addMonths(today(),6), url:""};
    const p = st.progress[s.key] ??= {}; p.ch ??= {};
    s.ch.forEach((ch,i) => {
      const c = p.ch[chCode(i)] ??= {};
      c.plan ??= ""; c.done ??= ""; c.u ??= 0; c.memo ??= ""; c.mt ??= "";
      c.s = Array.isArray(c.s) ? STEPS.map((_,k)=>!!c.s[k]) : STEPS.map(()=>false);
      const firstTime = !c.sec || typeof c.sec !== "object";
      c.sec = firstTime ? {} : c.sec;
      const ov = st.toc[s.key] && st.toc[s.key][chCode(i)];
      const n = Array.isArray(ov) && ov.length ? ov.length : ch[2].length;
      for (let j=0;j<n;j++){ const x = c.sec[secCode(j)] ??= {}; x.b ??= firstTime ? !!c.s[0] : false; x.q ??= firstTime ? !!c.s[2] : false; x.plan ??= ""; }
      Object.keys(c.sec).forEach(k => { if (!(+k >= 1 && +k <= n)) delete c.sec[k]; });
    });
    p.test ??= {}; p.test.plan ??= ""; p.test.done ??= ""; p.test.score ??= "";
  });

}

function saveLocal(){ lsSet(LKEY, JSON.stringify(state)); }
function commit(){
  state.rev = Date.now();

let unsub = null;
async function flush(){
  if (!ref || !window.cloudApi) return;

  writing = true; dirty = false;
  try { await window.cloudApi.save(ref, JSON.parse(JSON.stringify(state))); setSave("セーブ済み"); }
  catch(e){
    console.error(e);

}

  loadLocal(); render(); greet();

/* ================= 集計 ================= */
const isDone = c => !!c.done;
function subjStats(key){
  const s = SUBJ[key], p = state.progress[key], t = today();
  const items = s.ch.map((_,i) => p.ch[chCode(i)]);
  const done = items.filter(isDone).length, testDone = !!p.test.done, total = items.length + 1;
  const doneAll = done + (testDone ? 1 : 0);
  const planned = items.filter(c => c.plan).length;
  const expected = items.filter(c => c.plan && c.plan <= t).length + (p.test.plan && p.test.plan <= t ? 1 : 0);
  const lateList = s.ch.map((ch,i)=>({c:items[i], i})).filter(x => !isDone(x.c) && x.c.plan && x.c.plan < t);
  const late = lateList.length + (!testDone && p.test.plan && p.test.plan < t ? 1 : 0);
  const weak = items.map((c,i)=>({c,i})).filter(x=>x.c.u===1);
  // 細かい進捗：節ごとに教科書・問題集、単元ごとにミニテスト・総まとめ動画、実力テストは4つ分
  let unitDone = 0, unitAll = 0, secDue = 0, secWeek = 0;
  s.ch.forEach((_,i) => { const c = items[i], n = secsOf(key,i).length;
    for (let j=0;j<n;j++){ const x = secProg(c,j); unitAll += 2; unitDone += (x.b?1:0) + (x.q?1:0);
      if (isDone(c) || (x.b && x.q) || !x.plan) continue;
      if (x.plan <= t) secDue++; else if (x.plan <= addDays(t,6)) secWeek++; }
    unitAll += 2; unitDone += (c.s[1]?1:0) + (c.s[3]?1:0); });
  unitAll += 4; if (testDone) unitDone += 4;
  return {done, doneAll, total, planned, expected, late, lateList, ratio: unitDone/unitAll, weak, testDone, secDue, secWeek};
}
function allTasks(){
  const out = [];
  SUBJECTS.forEach((s,si) => {
    const p = state.progress[s.key];
    s.ch.forEach((ch,i) => {
      const c = p.ch[chCode(i)]; if (isDone(c)) return;
      const secs = secsOf(s.key,i);
      const j = secs.findIndex((_,jj) => { const x = secProg(c,jj); return !(x.b && x.q); });
      if (j >= 0) { const x = secProg(c,j);
        out.push({sub:s, code:`${chCode(i)}-${secCode(j)}`, chi:i, title:secs[j].t, sub2:ch[0], plan:x.plan || c.plan, step: !x.b ? `教科書を読む${secs[j].p?`（p.${secs[j].p}）`:""}` : "対応する問題集を解く", order: si*1000+i*20+j});
      } else { const k = c.s.findIndex(x=>!x);
        out.push({sub:s, code:chCode(i), chi:i, title:ch[0], sub2:"単元のしあげ", plan:c.plan, step: k<0 ? "修了日を記入" : STEPS[k] + (k===1 && c.mt ? `（${c.mt}）` : ""), order: si*1000+i*20+19}); }
    });
    if (!p.test.done && s.ch.every((_,i)=>isDone(p.ch[chCode(i)])))
      out.push({sub:s, code:"課題", title:"実力テスト", plan:p.test.plan, step:"Webで解答（初回が成績）", order: si*100+99});
  });
  out.sort((a,b) => (a.plan||"9999") < (b.plan||"9999") ? -1 : (a.plan||"9999") > (b.plan||"9999") ? 1 : a.order-b.order);
  return out;
}
const totalMin = () => state.logs.reduce((a,l)=>a+(+l.min||0),0);
function minutesIn(from, to){ return state.logs.filter(l => l.d >= from && l.d <= to).reduce((a,l)=>a+(+l.min||0),0); }
function streak(){
  const by = {}; state.logs.forEach(l => { by[l.d] = (by[l.d]||0) + (+l.min||0); });
  const t = today(); let n = 0;
  for (let d = by[t] ? t : addDays(t,-1); by[d] > 0; d = addDays(d,-1)) n++;
  return n;
}
function overall(){ return SUBJECTS.reduce((a,s)=>a+subjStats(s.key).ratio,0)/SUBJECTS.length; }

/* XP：ステップ10・単元修了30・実力テスト150・学習3分ごとに1 */
function xpTotal(){
  let xp = 0;
  SUBJECTS.forEach(s => { const p = state.progress[s.key];
    s.ch.forEach((_,i) => { const c = p.ch[chCode(i)]; xp += ((c.s[1]?1:0)+(c.s[3]?1:0))*10 + (c.done?30:0);
      Object.values(c.sec||{}).forEach(x => { xp += (x.b?5:0) + (x.q?5:0); }); });
    if (p.test.done) xp += 150; });
  return xp + Math.floor(totalMin()/3);
}
const lvOf = xp => Math.floor(Math.sqrt(xp/40)) + 1;
const xpFor = lv => 40*(lv-1)*(lv-1);

/* ================= 自動スケジュール ================= */
function autoPlan(key){
  const s = SUBJ[key], cfg = state.settings.subjects[key], p = state.progress[key];
  if (!cfg.start || !cfg.end || cfg.end <= cfg.start) { toast(`${s.name}：開始日より後の目標日を入れてね`); return false; }
  const span = diffDays(cfg.start, cfg.end);
  const review = Math.min(21, Math.max(3, Math.round(span*0.12)));
  const study = Math.max(1, span - review);
  // 節ごとの重み：ページ範囲があればページ数、なければ平均。単元の最後にミニテスト・問題集しあげ分を足す
  const known = []; s.ch.forEach((_,i) => secsOf(key,i).forEach(x => { const n = pageCount(x.p); if (n) known.push(n); }));
  const avg = known.length ? known.reduce((a,b)=>a+b,0)/known.length : 1;
  const units = [];
  s.ch.forEach((_,i) => { const c = p.ch[chCode(i)];
    secsOf(key,i).forEach((x,j) => units.push({w: pageCount(x.p) || avg, set: d => { const sp = c.sec[secCode(j)]; if (sp && !(sp.b && sp.q) && !isDone(c)) sp.plan = d; }}));
    units.push({w: avg*0.6, set: d => { if (!isDone(c)) c.plan = d; }}); });
  const total = units.reduce((a,u)=>a+u.w,0); let acc = 0;
  units.forEach(u => { acc += u.w; u.set(addDays(cfg.start, Math.max(0, Math.round(study*acc/total)))); });
  if (!p.test.done) p.test.plan = cfg.end;
  return true;
}

function spriteFor(mood, blink){
  const r = BASE.slice();
  const L = [6,7], Rt = [12,13];
  const clear = (eyes) => { const lash = eyes===L?[5,6,7]:[12,13,14];
    r[10] = setMany(r[10],lash,"s"); [11,12,13].forEach(j => r[j] = setMany(r[j],eyes,"s")); };
  const caret = (eyes) => { clear(eyes); r[11] = setMany(r[11],eyes,"k"); r[12] = setMany(r[12],[eyes[0]-1,eyes[1]+1],"k"); };
  const shut  = (eyes) => { clear(eyes); r[12] = setMany(r[12],[eyes[0]-1,...eyes,eyes[1]+1],"k"); };
  if (mood === "happy" || mood === "cheer") { caret(L); caret(Rt); r[14] = setMany(r[14],[8,9,10,11],"m"); }
  else if (mood === "wink") { caret(L); r[14] = setMany(r[14],[8,11],"m"); }
  else if (mood === "sleepy") { shut(L); shut(Rt); r[14] = setAt(r[14],10,"s"); }
  else if (mood === "worried") { r[14] = setMany(r[14],[9,10],"k"); if (blink) { shut(L); shut(Rt); } }
  else if (blink) { shut(L); shut(Rt); }
  if (mood === "cheer") { r[20] = setMany(r[20],[3,16],"g"); }
  return r;
}

function ac(){ if (!actx) { const A = window.AudioContext || window.webkitAudioContext; if (!A) return null; actx = new A(); } if (actx.state === "suspended") actx.resume(); return actx; }
function tone(seq, type="square", vol=.045){
  const a = ac(); if (!a) return; let t = a.currentTime;
  seq.forEach(([f,d]) => { const o = a.createOscillator(), g = a.createGain(); o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0005,t+d); o.connect(g).connect(a.destination); o.start(t); o.stop(t+d+.02); t += d*.85; });
}

      for (let i=0;i<len;i++){ const w = Math.random()*2-1; last = (last + .02*w)/1.02; d[i] = last*3.2 + w*.035; }

function defaultGoal(){
  const S = state.settings, c = [S.examDate, S.deadline].filter(Boolean).sort();
  return c[0] || addMonths(today(), 12);
}
function planCfg(){
  const S = state.settings; S.plan ??= {};
  const P = S.plan; P.start ||= today(); P.goal ||= defaultGoal(); P.mode ||= "seq"; P.buffer ??= 14;
  P.subs = P.subs && typeof P.subs === "object" ? P.subs : {};
  SUBJECTS.forEach(s => { P.subs[s.key] ??= true; });
  return P;
}
const subjWeight = key => SUBJ[key].ch.reduce((a,_,i) => a + secsOf(key,i).length + 0.6, 0);
function bulkPlan(){
  const P = planCfg(), subs = SUBJECTS.filter(s => P.subs[s.key]);
  const fail = t => { ui.bulkMsg = {ok:false, text:t}; toast(t); return null; };
  if (!subs.length) return fail("科目を1つ以上選んでね");
  if (!P.start || !P.goal) return fail("学習開始日とゴール日を入れてね");
  const end = addDays(P.goal, -Math.max(0, +P.buffer||0));
  if (end <= P.start) return fail(`ゴール日から見直し期間${P.buffer}日を引くと ${md(end)} になり、開始日 ${md(P.start)} より前です。ゴール日か見直し期間を変えてね`);
  const span = diffDays(P.start, end);
  if (P.mode === "par") {
    subs.forEach(s => { state.settings.subjects[s.key].start = P.start; state.settings.subjects[s.key].end = end; });
  } else {
    const w = subs.map(s => subjWeight(s.key)), tw = w.reduce((a,b)=>a+b,0);
    let acc = 0, prev = P.start;
    subs.forEach((s,i) => { acc += w[i]; const e2 = i === subs.length-1 ? end : addDays(P.start, Math.round(span*acc/tw));
      state.settings.subjects[s.key].start = prev; state.settings.subjects[s.key].end = e2; prev = addDays(e2, 1); });
  }
  let n = 0; subs.forEach(s => { if (autoPlan(s.key)) n++; });
  return {n, end, subs};

/* ファイル保存：結果は "saved" / "declined" / "failed" */
async function saveFile(name, text){
  try {
    const type = name.endsWith(".csv") ? "text/csv" : "application/json";
    const url = URL.createObjectURL(new Blob([text], {type: type + ";charset=utf-8"}));
    const el = document.createElement("a"); el.href = url; el.download = name; document.body.appendChild(el); el.click(); el.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000); return "saved";
  } catch(e) { return "failed"; }
}

function calCfg(){ const S = state.settings; S.cal ??= {}; S.cal.time ||= "20:00"; S.cal.dur ||= 60; return S.cal; }
function calendarDays(){
  const t = today(), byDay = {}, add = (d, txt) => { if (d && d >= t) (byDay[d] ??= []).push(txt); };
  SUBJECTS.forEach(s => { const p = state.progress[s.key];
    s.ch.forEach((ch,i) => { const c = p.ch[chCode(i)]; if (isDone(c)) return;
      secsOf(s.key,i).forEach((x,j) => { const sp = secProg(c,j); if (sp.b && sp.q) return;
        add(sp.plan, `${s.name} ${chCode(i)}-${secCode(j)} ${x.t}${x.p?` p.${x.p}`:""}（${sp.b?"問題集":"教科書→問題集"}）`); });
      add(c.plan, `${s.name} ${chCode(i)} ${ch[0]} のしあげ（中間ミニテスト${c.mt?` ${c.mt}`:""}・総まとめ動画）`); });
    if (!p.test.done) add(p.test.plan, `${s.name} 実力テスト（Webで解答・成績になるのは初回）`); });
  const S = state.settings;
  if (S.deadline) add(S.deadline, "TAC在籍期限（この日を過ぎると実力テスト・解説が見られません）");
  if (S.examDate) add(S.examDate, "電験三種 本試験");
  return byDay;
}
function calendarCsv(){
  const C = calCfg(), days = calendarDays(), q = v => `"${String(v).replace(/"/g,'""')}"`;
  const [hh, mm] = C.time.split(":").map(Number);
  const ampm = m => { const h = Math.floor(m/60)%24, mi = m%60; return `${pad(((h+11)%12)+1)}:${pad(mi)} ${h<12?"AM":"PM"}`; };
  const us = d => { const x = parse(d); return `${pad(x.getMonth()+1)}/${pad(x.getDate())}/${x.getFullYear()}`; };
  const startM = hh*60+mm, endM = startM + (+C.dur||60), endDay = endM >= 1440;
  const rows = [["Subject","Start Date","Start Time","End Date","End Time","All Day Event","Description","Private"].map(q).join(",")];
  Object.keys(days).sort().forEach(d => { const items = days[d];
    const title = `電験：${items[0]}${items.length>1?` ほか${items.length-1}件`:""}`;
    const desc = `今日までに終える予定 → ${items.map(x=>"・"+x).join(" ")} ／ ボルコの電験ルーム ${APP_URL}`;
    rows.push([title, us(d), ampm(startM), us(endDay ? addDays(d,1) : d), ampm(endM % 1440), "False", desc, "True"].map(q).join(",")); });
  return {csv: rows.join("\r\n") + "\r\n", count: rows.length-1, first: Object.keys(days).sort()[0], last: Object.keys(days).sort().slice(-1)[0]};
}

function dueItems(){

  SUBJECTS.forEach(s => { const p = state.progress[s.key];
    s.ch.forEach((ch,i) => { const c = p.ch[chCode(i)]; if (isDone(c)) return;
      let allSec = true;
      secsOf(s.key,i).forEach((x,j) => { const sp = secProg(c,j); if (sp.b && sp.q) return; allSec = false;

  return out;
}

  }
  if (a === "exportjson") {
    const name = `denken-data-${today()}.json`, text = JSON.stringify(state, null, 1);
    saveFile(name, text).then(res => {
      ui.dataMsg = res === "saved" ? {ok:true, text:`${name} を保存しました。新しいアプリの設定タブ「データの読み込み」で選んでください。`}
        : res === "declined" ? {ok:false, text:"保存をキャンセルしました"} : {ok:false, text:"保存できませんでした。下の内容をコピーして .json ファイルにしてください。", raw:text};
      render(); });
    return;
  }
  if (a === "bulkcancel") { ui.armed = null; render(); return; }
  if (a === "bulk" || a === "bulkgo") {
    const hasPlan = SUBJECTS.some(x => Object.values(state.progress[x.key].ch).some(c => c.plan || Object.values(c.sec||{}).some(y => y.plan)));
    if (a === "bulk" && hasPlan) { clearTimeout(armT); ui.armed = "bulk"; ui.bulkMsg = null; render();
      const el = document.getElementById("plconfirm"); if (el) el.scrollIntoView({block:"center", behavior:"smooth"}); return; }
    ui.armed = null; const r = bulkPlan();
    if (r) {
      const text = `${md(today())} に作成しました：${r.subs.map(s=>{const c=state.settings.subjects[s.key]; return `${s.name} ${md(c.start)}〜${md(c.end)}`;}).join("、")}`;
      ui.bulkMsg = {ok:true, text}; planCfg().last = text;
      commit();
      cheer(`${r.subs.map(s=>s.name).join("・")}の予定を作ったよ！${md(r.end)}までに全部終わる計画だよ。`, true);
      toast("予定を作成しました");
    } else render();
    const m = document.getElementById("plmsg"); if (m) m.scrollIntoView({block:"center", behavior:"smooth"});
    return;
  }
  if (a === "tocedit") { ui.editToc = k || null; render(); return; }
  if (a === "tocsave") {
    const i = +c.slice(2)-1, ta = document.getElementById(`toc-${s}-${c}`);
    const list = ta.value.split(/\r?\n/).map(l => l.trim()).filter(Boolean).slice(0,40).map(l => {
      const m = l.split(/\s*[|｜]\s*/); return {t: m[0].replace(/^(SEC(TION)?\s*)?\d{1,2}[\s.．:：]+/i,"").slice(0,80) || m[0].slice(0,80), p: (m[1]||"").replace(/^p\.?\s*/i,"").slice(0,20)}; });
    if (!list.length) { toast("節を1つ以上入れてね"); return; }
    state.toc[s] ??= {}; state.toc[s][c] = list;
    const ch = state.progress[s].ch[c];
    list.forEach((_,j) => { ch.sec[secCode(j)] ??= {b:false,q:false,plan:""}; });
    Object.keys(ch.sec).forEach(k2 => { if (+k2 > list.length) delete ch.sec[k2]; });
    syncChapter(s, i); ui.editToc = null; commit(); toast("目次を保存しました"); return;
  }
  if (a === "tocreset") {
    const i = +c.slice(2)-1; if (state.toc[s]) delete state.toc[s][c];
    const ch = state.progress[s].ch[c], n = SUBJ[s].ch[i][2].length;
    for (let j=0;j<n;j++) ch.sec[secCode(j)] ??= {b:false,q:false,plan:""};
    Object.keys(ch.sec).forEach(k2 => { if (+k2 > n) delete ch.sec[k2]; });
    syncChapter(s, i); ui.editToc = null; commit(); toast("第3版の目次に戻しました"); return;
  }
  if (a === "subj") { ui.subj = k; lsSet("denken.subj", k); render(); return; }
  if (a === "logsub") { ui.logSub = k; render(); return; }
  if (a === "logmin") { ui.logMin = +k; render(); return; }
  if (a === "step") {
    const i = +c.slice(2)-1, ch = state.progress[s].ch[c], on = !ch.s[+k]; ch.s[+k] = on;
    const name = SUBJ[s].ch[i][0];
    if (+k === 0 || +k === 2) { const f = +k === 0 ? "b" : "q"; secsOf(s,i).forEach((_,j) => { ch.sec[secCode(j)][f] = on; }); }
    const big = syncChapter(s, i);
    commit();
    if (big) cheer(`${SUBJ[s].name} ${c}「${name}」クリア！ +40ボルト`, true);
    else if (on) cheer(pick([`${STEPS[+k]}おわり！ +10ボルト`, `いいね！「${name}」の${STEPS[+k]}クリア！`, `その調子！次は${STEPS[+k+1]||"修了"}だね。`]));
    return;
  }
  if (a === "u") { const ch = state.progress[s].ch[c]; ch.u = ch.u === +k ? 0 : +k; commit();
    if (ch.u===1) say("苦手マークしたよ。テキストに戻って、あとで一緒に復習しよう！", 5000); else if (ch.u===3) cheer("得意になったんだね！すごい！"); return; }
  if (a === "auto") { if (ui.armed !== s) { arm(s); return; } ui.armed = null;
    if (autoPlan(s)) { commit(); say(`${SUBJ[s].name}の予定を作ったよ。いっしょにがんばろう！`, 5000); } else render(); return; }
  if (a === "autoall") { if (ui.armed !== "all") { arm("all"); return; } ui.armed = null;
    let ok = 0; SUBJECTS.forEach(x => { if (autoPlan(x.key)) ok++; });
    if (ok) { commit(); cheer(`${ok}科目の予定を作ったよ！まずはホームのクエストから。`); } else render(); return; }
  if (a === "seq") {
    const S = state.settings, st = S.subjects.riron.start || today(), end = S.examDate || S.deadline;
    if (!end || end <= st) { toast("先に試験日か在籍期限を入れてね"); return; }
    const span = diffDays(st, end), w = SUBJECTS.map(x=>x.ch.reduce((a,c)=>a+c[1],0)), tw = w.reduce((a,b)=>a+b,0);
    let acc = 0, prev = st;
    SUBJECTS.forEach((x,i) => { acc += w[i]; const e2 = addDays(st, Math.round(span*acc/tw) - (i===3?7:0)); S.subjects[x.key].start = prev; S.subjects[x.key].end = e2; prev = addDays(e2,1); });
    commit(); say("4科目の期間を割り振ったよ。次は「全科目の予定を自動作成」を押してね。", 6000); return;
  }
  if (a === "dellog") { if (ui.armed !== "log-"+k) { arm("log-"+k); return; } ui.armed = null; state.logs = state.logs.filter(l => l.id !== k); toast("記録を削除しました"); commit(); return; }
  if (a === "reset") { if (ui.armed !== "reset") { arm("reset"); return; } ui.armed = null; const keep = state.settings; state = defaultState(); state.settings = keep; state = normalize(state); lsSet("denken.lv","1"); toast("進捗と記録を消去しました"); commit(); return; }
  // タイマー
  if (a === "tsub") { timer.sub = k; saveTimer(); render(); return; }
  if (a === "tdur") { timer.dur = +k; timer.remain = timer.dur*60000; saveTimer(); render(); return; }
  if (a === "tstart") { ac(); timer.endAt = Date.now() + timer.remain; timer.running = true; saveTimer(); sfx("blip"); render(); say(pick(["よーし、いっしょに集中しよう！","スマホは置いて、紙とペンを用意してね。","計算問題は手を動かして解こう！"]), 5000); return; }
  if (a === "tpause") { timer.remain = tLeft(); timer.running = false; saveTimer(); render(); return; }
  if (a === "treset") { timer.running = false; timer.remain = timer.dur*60000; saveTimer(); render(); return; }
  if (a === "tsave") { const m = Math.floor((timer.dur*60000 - tLeft())/60000); if (m>=1) { addLog(timer.sub, m, "集中タイマー（途中まで）"); timer.running=false; timer.remain = timer.dur*60000; saveTimer(); commit(); cheer(`${m}分ぶん記録したよ。おつかれさま！`); } return; }
  if (a === "copyurl") {
    const inp = document.getElementById("appUrl");
    const fallback = () => { inp.focus(); inp.select(); toast("選択しました。長押しかCtrl+Cでコピーしてね"); };
    try { navigator.clipboard.writeText(APP_URL).then(() => toast("URLをコピーしました"), fallback); } catch(err) { fallback(); }
    return;
  }
  if (a === "rain") { setRain(!fx.rain); render(); return; }
  if (a === "sound") { ui.sound = !ui.sound; lsSet("denken.sound", ui.sound ? "on" : "off"); if (ui.sound) sfx("blip"); render(); return; }
});

document.addEventListener("change", e => {
  const el = e.target, a = el.dataset && el.dataset.act; if (!a) return;
  const s = el.dataset.s, c = el.dataset.c, k = el.dataset.k, v = el.value;
  let reaction = null;
  if (a === "plan") state.progress[s].ch[c].plan = v;
  else if (a === "done") { const ch = state.progress[s].ch[c]; const was = ch.done; ch.done = v; if (v) { ch.s = ch.s.map(()=>true); Object.values(ch.sec).forEach(x => { x.b = true; x.q = true; }); if (!was) reaction = `${SUBJ[s].name} ${c} クリア！`; } }
  else if (a === "memo") state.progress[s].ch[c].memo = v.slice(0,200);
  else if (a === "mt") state.progress[s].ch[c].mt = v.slice(0,60);
  else if (a === "cal") { const C = calCfg(); if (k === "time") { if (/^\d{2}:\d{2}$/.test(v)) C.time = v; } else C.dur = Math.max(10, Math.min(240, +v || 60)); ui.calMsg = null; ui.calText = null; }
  else if (a === "pl") { const P = planCfg(); P[k] = k === "buffer" ? Math.max(0, Math.min(120, +v || 0)) : v; ui.armed = null; }
  else if (a === "secplan") { const sp = state.progress[s].ch[c].sec[secCode(+k)]; if (sp) sp.plan = v; }
  else if (a === "tplan") state.progress[s].test.plan = v;
  else if (a === "tdone") { const was = state.progress[s].test.done; state.progress[s].test.done = v; if (v && !was) reaction = `${SUBJ[s].name}の実力テスト提出！トロフィーゲット！ +150ボルト`; }
  else if (a === "tscore") state.progress[s].test.score = v;
  else if (a === "set") state.settings[k] = k === "weeklyGoal" ? Math.max(0, +v || 0) : v.trim();
  else if (a === "sset") state.settings.subjects[s][k] = v.trim();
  else return;
  if ((a === "set" && k === "tacTop") || (a === "sset" && k === "url")) { if (v.trim() && !safeUrl(v.trim())) toast("https:// で始まるURLを入れてね"); }
  commit();
  if (reaction) cheer(reaction, true);
});

document.addEventListener("submit", e => {
  if (e.target.id !== "logForm") return;
  e.preventDefault();
  const d = document.getElementById("logDate").value || today();
  const min = Math.round(+document.getElementById("logMinInput").value || ui.logMin);
  if (!(min > 0 && min <= 1440)) { toast("1〜1440分で入れてね"); return; }
  addLog(ui.logSub, min, document.getElementById("logMemo").value.trim(), d);
  commit();
  cheer(min >= 90 ? `${hm(min)}も！？がんばったね！ +${Math.floor(min/3)}ボルト` : `${(SUBJ[ui.logSub]||{name:"勉強"}).name} ${hm(min)}、記録したよ！ +${Math.floor(min/3)}ボルト`, min >= 90);
});
document.addEventListener("input", e => { if (e.target.id === "logMinInput") { const m = +e.target.value; if (m>0) ui.logMin = m; } });

if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(() => {});
initStore();
})();
</script>

</body>
</html>
